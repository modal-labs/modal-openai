[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modal-openai"
version = "0.1.0"
description = "Scaffold OpenAI webhook handlers and Modal sandbox configurations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.25",
    "fastapi>=0.115",
    "modal>=1.5.5",
    "openai>=1.92",
    "rich>=13.7",
]

[project.scripts]
modal-agents = "modal_agents.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.15",
    "mypy>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["modal_agents"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["modal_agents"]
check_untyped_defs = true
