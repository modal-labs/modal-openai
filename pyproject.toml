[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modal-openai"
version = "0.1.0"
description = "Webhook-managed OpenAI Agents API sessions in Modal sandboxes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.25,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "logfire[httpx]>=4.41,<5",
    "modal>=1.5.5,<2",
    "openai>=2,<4",
    "opentelemetry-api>=1.44,<2",
    "pydantic>=2.7,<3",
    "rich>=13.7,<16",
]

[project.scripts]
modal-agents = "modal_agents.cli:run"

[project.urls]
Homepage = "https://github.com/modal-labs/modal-openai"
Repository = "https://github.com/modal-labs/modal-openai"
Issues = "https://github.com/modal-labs/modal-openai/issues"

[dependency-groups]
preview = [
    "agent-api-sdk @ git+https://github.com/OpenAI-Early-Access/agents-api-python-preview.git@076c5f3fb9dbad9a1096a77943163fbc77061a0d",
]
dev = [
    "basedpyright>=1.39.10",
    "coverage>=7.10",
    "mypy>=1.17",
    "pytest>=9.1.1",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["modal_agents"]

[tool.uv]
default-groups = ["dev", "preview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["modal_agents"]
omit = ["modal_agents/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "BLE", "C4", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"modal_agents/cli.py" = ["PLR0913"]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["modal_agents"]
plugins = ["pydantic.mypy"]
