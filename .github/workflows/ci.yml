name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --no-group preview
      - run: uv run --no-group preview ruff format --check modal_agents tests agents hooks
      - run: uv run --no-group preview ruff check modal_agents tests agents hooks
      # Full SDK type checks run locally with the private preview group installed.
      - run: uv run --no-group preview coverage run -m pytest
      - run: uv run --no-group preview coverage report
      - run: uv build
      - name: Install and exercise the wheel outside the checkout
        run: |
          uv venv /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/modal-agents --help
          /tmp/wheel-smoke/bin/python -m modal_agents --help

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-group preview
      - run: uv run --no-group preview pytest
